name: Diag
on:
  push:
    branches: [claude/release-0.2.0]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opentabz/web exec playwright install --with-deps firefox
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
      - run: pnpm build
      - run: pnpm fixtures
      - run: pnpm --filter @opentabz/web exec playwright test --project=firefox e2e/zz-diag.spec.ts e2e/engraving.spec.ts
