name: CI

on:
  push:
    branches: [main, claude/release-0.2.0]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests, build, budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from Corepack in the next step, after setup-node: no automatic pnpm cache.
          package-manager-cache: false
      - run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Feature matrix
        run: node scripts/feature-matrix.ts
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Bundle budgets
        run: node scripts/check-budgets.ts
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: check
    runs-on: ubuntu-latest
    # WebKit runs the desktop and the phone projects: about half an hour.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=chromium --project=mobile-chromium
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit --project=mobile-webkit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from Corepack in the next step, after setup-node: no automatic pnpm cache.
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm --filter @opentabz/web exec playwright install --with-deps ${{ matrix.browser }}
      # Runners have no sound card. Chromium plays into a fake device of its own; Firefox needs a
      # sound server to play into, or its audio clock never moves.
      - name: Virtual sound card
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - name: Build
        run: pnpm build
      - name: Fixtures
        run: pnpm fixtures
      - name: E2E
        run: pnpm --filter @opentabz/web exec playwright test ${{ matrix.projects }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from Corepack in the next step, after setup-node: no automatic pnpm cache.
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
