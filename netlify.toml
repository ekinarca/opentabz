# Netlify build configuration for opentabz.com (ADR-0008).
# Headers and redirects live in apps/web/public/_headers and _redirects so they also apply to
# manual (drag-and-drop) deploys of apps/web/dist.
[build]
  base = "/"
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
