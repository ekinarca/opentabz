# Netlify configuration for opentabz.com (ADR-0008).
[build]
  base = "/"
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"

# Single-page application: unknown paths render the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' https: blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self), midi=(self), fullscreen=(self)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/demos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
